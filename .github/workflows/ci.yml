name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runner macos-14 is Apple Silicon (arm64) — the only macOS target
        # this project supports.
        os: [ubuntu-24.04, macos-14]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libgit2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config libgit2
          # brew keeps the .pc files under its own prefix; pkg-config is told where.
          echo "PKG_CONFIG_PATH=$(brew --prefix libgit2)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'

      - name: Build the app icon (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # `iconutil` is macOS-only, so the .icns is made here from the checked-in
          # PNG rather than committed. The sizes are exactly the ones it accepts.
          png=packaging/icons/gitmycelium-1024.png
          iconset=packaging/icons/gitmycelium.iconset
          rm -rf "$iconset"
          mkdir -p "$iconset"
          for base in 16 32 128 256 512; do
            sips -s format png -z "$base" "$base" "$png" --out "$iconset/icon_${base}x${base}.png" >/dev/null
            double=$((base * 2))
            sips -s format png -z "$double" "$double" "$png" --out "$iconset/icon_${base}x${base}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o packaging/icons/gitmycelium.icns

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Render UI offscreen (Linux)
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen ./build/src/gitmycelium --shot ui.png .
          test -s ui.png

      - name: Render UI offscreen (macOS)
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen ./build/src/GitMycelium.app/Contents/MacOS/GitMycelium --shot ui.png .
          test -s ui.png

      - name: Package the .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=build/src/GitMycelium.app
          # Qt's frameworks have to travel inside the bundle or the app only runs
          # where Qt is installed.
          macdeployqt="$(command -v macdeployqt || echo "${QT_ROOT_DIR}/bin/macdeployqt")"
          "$macdeployqt" "$app"
          # Ad-hoc signature: no Apple account needed, and it stops Gatekeeper from
          # calling the bundle "damaged". A downloaded copy is still quarantined and
          # is allowed once in Privacy & Security (README, "Opening the app on macOS").
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose=2 "$app"
          (cd build && cpack -G DragNDrop)
          ls -l build/*.dmg

      - name: Upload UI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-${{ matrix.os }}
          path: ui.png

      - name: Upload the macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gitmycelium-macos-arm64
          path: build/*.dmg

  windows:
    name: build (windows-2022)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      LIBGIT2_VERSION: '1.9.1'

    steps:
      # The runner's git converts line endings on checkout; the sources are LF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'

      - name: Cache libgit2
        id: libgit2-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libgit2
          key: libgit2-${{ env.LIBGIT2_VERSION }}-windows-msvc

      - name: Build libgit2
        if: steps.libgit2-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/libgit2/libgit2/archive/refs/tags/v${LIBGIT2_VERSION}.tar.gz" | tar xz
          cmake -S "libgit2-${LIBGIT2_VERSION}" -B libgit2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libgit2" \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_HTTPS=OFF -DUSE_SSH=OFF
          cmake --build libgit2-build
          cmake --install libgit2-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBGIT2_ROOT="$RUNNER_TEMP/libgit2"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package the folder
        run: |
          set -euo pipefail
          cmake --install build --prefix dist/GitMycelium
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime \
            dist/GitMycelium/GitMycelium.exe
          cp "$RUNNER_TEMP/libgit2/bin/git2.dll" dist/GitMycelium/
          mkdir -p dist/GitMycelium/platforms
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" dist/GitMycelium/platforms/
          (cd dist && 7z a -tzip ../GitMycelium-windows-x86_64.zip GitMycelium >/dev/null)

      - name: Render UI offscreen
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          dist/GitMycelium/GitMycelium.exe --version
          dist/GitMycelium/GitMycelium.exe --probe . | head -5
          dist/GitMycelium/GitMycelium.exe --shot ui.png .
          test -s ui.png

      - name: Upload UI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-windows-2022
          path: ui.png

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: gitmycelium-windows-x86_64
          path: GitMycelium-windows-x86_64.zip
