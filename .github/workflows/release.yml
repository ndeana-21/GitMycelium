name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  LIBGIT2_VERSION: '1.9.1'
  QT_VERSION: '6.8.3'

jobs:
  linux-appimage:
    name: Linux AppImage
    # The oldest supported runner: the AppImage runs on any distribution whose glibc
    # is at least this one's (2.35).
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config zlib1g-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libegl1 libfontconfig1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      - name: Build libgit2
        # Ubuntu 22.04 ships libgit2 1.1. Network access goes through the git binary,
        # so libgit2 is built without HTTPS and SSH and pulls in nothing else.
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/libgit2/libgit2/archive/refs/tags/v${LIBGIT2_VERSION}.tar.gz" | tar xz
          cmake -S "libgit2-${LIBGIT2_VERSION}" -B libgit2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_HTTPS=OFF -DUSE_SSH=OFF
          cmake --build libgit2-build
          sudo cmake --install libgit2-build
          sudo ldconfig

      - name: Build GitMycelium
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DGMC_BUILD_NUMBER=${{ github.run_number }}
          cmake --build build --target gitmycelium
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Add third-party license texts
        # The AppImage carries Qt and libgit2, so their license texts travel with it.
        run: |
          set -euo pipefail
          doc=AppDir/usr/share/doc/gitmycelium/third_party
          mkdir -p "$doc"
          cp third_party/qt/LGPL-3.0.txt "$doc/Qt-LGPL-3.0.txt"
          cp third_party/qt/GPL-3.0.txt "$doc/Qt-GPL-3.0.txt"
          cp "libgit2-${LIBGIT2_VERSION}/COPYING" "$doc/libgit2-COPYING.txt"
          printf 'Qt %s source: https://download.qt.io/archive/qt/\nlibgit2 %s source: https://github.com/libgit2/libgit2/releases/tag/v%s\n' \
            "$QT_VERSION" "$LIBGIT2_VERSION" "$LIBGIT2_VERSION" > "$doc/SOURCES.txt"

      - name: Package the AppImage
        run: |
          set -euo pipefail
          base=https://github.com/linuxdeploy
          curl -fsSLO "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          plugins="libqoffscreen.so"
          if [ -e "$QT_ROOT_DIR/plugins/platforms/libqwayland-generic.so" ]; then
            plugins="$plugins;libqwayland-generic.so"
          fi
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_PLATFORM_PLUGINS="$plugins"
          export LDAI_OUTPUT="GitMycelium-${TAG#v}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/gitmycelium.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/gitmycelium.svg \
            --plugin qt --output appimage
          echo "APPIMAGE=$LDAI_OUTPUT" >> "$GITHUB_ENV"

      - name: Smoke-test the AppImage
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen
          "./$APPIMAGE" --version
          # HTTPS from inside the package: an answer (a manifest or a 404) proves a TLS
          # backend travelled with it; a missing one fails before any status.
          "./$APPIMAGE" --update-check | tee update-check.txt || true
          grep -qE '^(published:|error: The newest release publishes no update manifest)' update-check.txt
          "./$APPIMAGE" --probe . | head -5
          "./$APPIMAGE" --shot ui.png .
          test -s ui.png
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"

      - name: Update a copy from the AppImage, as the app does
        # The whole in-app path: manifest, download, checksum, replacing the file.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen
          work="$RUNNER_TEMP/update-check"
          mkdir -p "$work"
          cp "$APPIMAGE" "$work/old.AppImage"
          printf 'stale' >> "$work/old.AppImage"
          sha=$(cut -d' ' -f1 "$APPIMAGE.sha256")
          size=$(stat -c%s "$APPIMAGE")
          printf '{"version":"99.0.0","build":1,"assets":{"linux-x86_64":{"url":"file://%s","sha256":"%s","size":%s}}}' \
            "$PWD/$APPIMAGE" "$sha" "$size" > "$work/update.json"
          GMC_UPDATE_MANIFEST="file://$work/update.json" "$work/old.AppImage" --update-install
          cmp "$work/old.AppImage" "$APPIMAGE"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gitmycelium-linux-x86_64
          path: |
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE }}.sha256

  macos-dmg:
    name: macOS DMG
    # macos-14 is Apple Silicon, the only macOS target.
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install build tools
        run: brew install ninja pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      - name: Build libgit2
        # Built here rather than taken from Homebrew: Homebrew's links OpenSSL and
        # libssh2, which would then travel inside the bundle for nothing (network
        # access goes through the git binary), and targets only the newest macOS.
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/libgit2/libgit2/archive/refs/tags/v${LIBGIT2_VERSION}.tar.gz" | tar xz
          cmake -S "libgit2-${LIBGIT2_VERSION}" -B libgit2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libgit2" \
            -DCMAKE_INSTALL_NAME_DIR="$RUNNER_TEMP/libgit2/lib" \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_HTTPS=OFF -DUSE_SSH=OFF
          cmake --build libgit2-build
          cmake --install libgit2-build
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libgit2/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build the app icon
        run: |
          set -euo pipefail
          png=packaging/icons/gitmycelium-1024.png
          iconset=packaging/icons/gitmycelium.iconset
          mkdir -p "$iconset"
          for base in 16 32 128 256 512; do
            sips -s format png -z "$base" "$base" "$png" --out "$iconset/icon_${base}x${base}.png" >/dev/null
            double=$((base * 2))
            sips -s format png -z "$double" "$double" "$png" --out "$iconset/icon_${base}x${base}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o packaging/icons/gitmycelium.icns

      - name: Build GitMycelium
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGMC_BUILD_NUMBER=${{ github.run_number }}
          cmake --build build --target gitmycelium

      - name: Bundle, sign and package
        run: |
          set -euo pipefail
          app=build/src/GitMycelium.app
          # The bundle carries Qt and libgit2, so their license texts travel with it.
          doc="$app/Contents/Resources/third_party"
          mkdir -p "$doc"
          cp third_party/qt/LGPL-3.0.txt "$doc/Qt-LGPL-3.0.txt"
          cp third_party/qt/GPL-3.0.txt "$doc/Qt-GPL-3.0.txt"
          cp "libgit2-${LIBGIT2_VERSION}/COPYING" "$doc/libgit2-COPYING.txt"
          printf 'Qt %s source: https://download.qt.io/archive/qt/\nlibgit2 %s source: https://github.com/libgit2/libgit2/releases/tag/v%s\n' \
            "$QT_VERSION" "$LIBGIT2_VERSION" "$LIBGIT2_VERSION" > "$doc/SOURCES.txt"
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -libpath="$RUNNER_TEMP/libgit2/lib"
          # Nothing outside the bundle and the system may be linked any more.
          if otool -L "$app/Contents/MacOS/GitMycelium" | tail -n +2 \
               | grep -vE '@(rpath|executable_path|loader_path)/|/usr/lib/|/System/'; then
            echo "the binary still links something outside the bundle" >&2
            exit 1
          fi
          # Ad-hoc signature: no Apple account needed, and Gatekeeper does not call
          # the bundle damaged. It is not notarized, so the first launch is allowed in
          # Privacy & Security (README, "Opening the app on macOS").
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          (cd build && cpack -G DragNDrop)
          dmg="GitMycelium-${TAG#v}-arm64.dmg"
          mv build/*.dmg "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Smoke-test the bundle
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          bin=build/src/GitMycelium.app/Contents/MacOS/GitMycelium
          "$bin" --version
          "$bin" --update-check | tee update-check.txt || true
          grep -qE '^(published:|error: The newest release publishes no update manifest)' update-check.txt
          "$bin" --probe . | head -5
          "$bin" --shot ui.png .
          test -s ui.png
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Update a copy from the DMG, as the app does
        # The whole in-app path: manifest, download, checksum, mounting the image,
        # copying and verifying the bundle. A license agreement in the image made
        # `hdiutil attach` wait for an answer, and the app with it.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          hdiutil imageinfo "$DMG" | grep -q 'Software License Agreement: false'
          work="$RUNNER_TEMP/update-check"
          mkdir -p "$work"
          ditto build/src/GitMycelium.app "$work/GitMycelium.app"
          sha=$(cut -d' ' -f1 "$DMG.sha256")
          size=$(stat -f%z "$DMG")
          printf '{"version":"99.0.0","build":1,"assets":{"macos-arm64":{"url":"file://%s","sha256":"%s","size":%s}}}' \
            "$PWD/$DMG" "$sha" "$size" > "$work/update.json"
          GMC_UPDATE_MANIFEST="file://$work/update.json" QT_QPA_PLATFORM=offscreen \
            "$work/GitMycelium.app/Contents/MacOS/GitMycelium" --update-install
          codesign --verify --deep --strict "$work/.GitMycelium.app.update"
          "$work/.GitMycelium.app.update/Contents/MacOS/GitMycelium" --version

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gitmycelium-macos-arm64
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256

  windows-zip:
    name: Windows archive
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      - name: Build libgit2
        # Network access goes through the git binary, so libgit2 needs neither
        # HTTPS nor SSH.
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/libgit2/libgit2/archive/refs/tags/v${LIBGIT2_VERSION}.tar.gz" \
            | tar xz --exclude='*/tests'
          cmake -S "libgit2-${LIBGIT2_VERSION}" -B libgit2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libgit2" \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_HTTPS=OFF -DUSE_SSH=OFF
          cmake --build libgit2-build
          cmake --install libgit2-build

      - name: Build GitMycelium
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLIBGIT2_ROOT="$RUNNER_TEMP/libgit2" -DGMC_BUILD_NUMBER=${{ github.run_number }}
          cmake --build build --target gitmycelium

      - name: Package the folder
        # A folder that runs where it is unpacked: Qt, the MSVC runtime, git2.dll and
        # the license texts beside the executable. Git for Windows is the reader's.
        run: |
          set -euo pipefail
          app=dist/GitMycelium
          cmake --install build --prefix "$app"
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime \
            "$app/GitMycelium.exe"
          cp "$RUNNER_TEMP/libgit2/bin/git2.dll" "$app/"
          mkdir -p "$app/platforms"
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$app/platforms/"
          doc="$app/Licenses/third_party"
          mkdir -p "$doc"
          cp third_party/qt/LGPL-3.0.txt "$doc/Qt-LGPL-3.0.txt"
          cp third_party/qt/GPL-3.0.txt "$doc/Qt-GPL-3.0.txt"
          cp "libgit2-${LIBGIT2_VERSION}/COPYING" "$doc/libgit2-COPYING.txt"
          printf 'Qt %s source: https://download.qt.io/archive/qt/\nlibgit2 %s source: https://github.com/libgit2/libgit2/releases/tag/v%s\n' \
            "$QT_VERSION" "$LIBGIT2_VERSION" "$LIBGIT2_VERSION" > "$doc/SOURCES.txt"
          zip="GitMycelium-${TAG#v}-windows-x86_64.zip"
          (cd dist && 7z a -tzip "../$zip" GitMycelium >/dev/null)
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Smoke-test the folder
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          bin=dist/GitMycelium/GitMycelium.exe
          "$bin" --version
          "$bin" --update-check | tee update-check.txt || true
          grep -qE '^(published:|error: The newest release publishes no update manifest)' update-check.txt
          "$bin" --probe . | head -5
          "$bin" --shot ui.png .
          test -s ui.png
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Update a copy from the archive, as the app does
        # The whole in-app path: manifest, download, checksum, unpacking beside the
        # folder. The swap itself waits for the app to exit, so it is not run here.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          work="$(cygpath -m "$RUNNER_TEMP")/update-check"
          mkdir -p "$work"
          cp -r dist/GitMycelium "$work/GitMycelium"
          sha=$(cut -d' ' -f1 "$ZIP.sha256")
          size=$(stat -c%s "$ZIP")
          zipUrl="file:///$(cygpath -m "$PWD/$ZIP")"
          printf '{"version":"99.0.0","build":1,"assets":{"windows-x86_64":{"url":"%s","sha256":"%s","size":%s}}}' \
            "$zipUrl" "$sha" "$size" > "$work/update.json"
          GMC_UPDATE_MANIFEST="file:///$work/update.json" QT_QPA_PLATFORM=offscreen \
            "$work/GitMycelium/GitMycelium.exe" --update-install
          "$work/.GitMycelium.update/GitMycelium.exe" --version

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gitmycelium-windows-x86_64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  publish:
    name: Publish the release
    needs: [linux-appimage, macos-dmg, windows-zip]
    # A tag with a suffix (v1.1.0-rc1) builds but publishes nothing.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the update manifest
        # What the app's updater reads (releases/latest/download/update.json): the
        # version, this run's build number, and each package with its checksum. The
        # build number moves on every run, so a re-run of the same tag is an update.
        env:
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}"
          keys = {"-x86_64.AppImage": "linux-x86_64", "-arm64.dmg": "macos-arm64",
                  "-windows-x86_64.zip": "windows-x86_64"}
          assets = {}
          for path in sorted(pathlib.Path("dist").iterdir()):
              key = next((k for suffix, k in keys.items() if path.name.endswith(suffix)), None)
              if key is None:
                  continue
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              published = (path.parent / (path.name + ".sha256")).read_text().split()[0]
              assert digest == published, f"{path.name}: {digest} != {published}"
              assets[key] = {"url": f"{base}/{path.name}", "sha256": digest, "size": len(data)}
          assert set(assets) == set(keys.values()), assets
          manifest = {
              "version": tag.removeprefix("v"),
              "build": int(os.environ["BUILD"]),
              "tag": tag,
              "notes": f"https://github.com/{os.environ['REPO']}/releases/tag/{tag}",
              "assets": assets,
          }
          pathlib.Path("dist/update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "GitMycelium $version" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --title "GitMycelium $version" --notes-file notes.md --verify-tag
          fi
